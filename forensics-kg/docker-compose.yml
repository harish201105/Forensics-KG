# ⚠️  NOT the primary database for normal development.
#
# Your forensic graph lives in your **Neo4j Desktop** DBMS (default `neo4j`
# database). This compose file starts a SEPARATE, EMPTY Neo4j that maps the same
# ports (7474/7687) — running it alongside Neo4j Desktop causes a port-7687
# collision and makes the real graph appear empty.
#
# Use this ONLY for a throwaway/CI Neo4j when Neo4j Desktop is NOT running.
# For normal use, start the stack with `./start.sh` (or the Neo4j Desktop app).
services:
  neo4j:
    image: neo4j:5.15-community
    container_name: forensics-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/forensics_kg_2024
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "forensics_kg_2024", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
